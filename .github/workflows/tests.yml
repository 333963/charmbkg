name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .   # zakres: pyproject [tool.ruff].include
      - run: pytest -q -m "not slow"
      - run: pytest -q analysis/afp_mix/test_run_data.py   # sterownik f_acc (toy w formacie parquet); wymaga pyarrow z [dev]
